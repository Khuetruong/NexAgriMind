# AgriMind Core dùng chung toàn cầu (đề xuất đặt ở Singapore, A07).
# Core KHÔNG giữ dữ liệu trang trại: vai `core` từ chối mọi yêu cầu có mã trại hoặc
# dữ liệu trại; không có cổng đồng ý dữ liệu, không nối Nexagri.
# Bên gọi Core chủ yếu là các điểm trong nước (khoá chỉ có quyền ask:general).
name: agrimind-core

services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports: ["443:443", "80:80"]
    environment:
      AGRIMIND_DOMAIN: ${AGRIMIND_DOMAIN:?đặt tên miền, ví dụ core.agrimind.ai}
    volumes:
      - ../vn/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [edge]
    depends_on: [agrimind]

  agrimind:
    image: ${AGRIMIND_IMAGE:-ghcr.io/khuetruong/nexagrimind:latest}
    build: ../..
    restart: unless-stopped
    environment:
      AGRIMIND_ENV: production
      AGRIMIND_ROLE: core
      AGRIMIND_CLIENTS_FILE: /run/agrimind/clients.yaml
      AGRIMIND_AUDIT_FILE: /var/lib/agrimind/audit/audit.jsonl
      AGRIMIND_CORPUS_DIR: /var/lib/agrimind/corpus
      AGRIMIND_LLM_URL: ${AGRIMIND_LLM_URL:-http://vllm:8000/v1}
      AGRIMIND_LLM_MODEL: ${AGRIMIND_LLM_MODEL:-Qwen/Qwen3-8B}
      AGRIMIND_QDRANT_URL: http://qdrant:6333
      AGRIMIND_QDRANT_API_KEY: ${QDRANT_API_KEY:?}
      AGRIMIND_EMBED_URL: http://embed:80/v1
    volumes:
      - ./clients.yaml:/run/agrimind/clients.yaml:ro
      - corpus:/var/lib/agrimind/corpus
      - audit:/var/lib/agrimind/audit
    networks: [edge, internal]
    depends_on: [qdrant, embed]

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes: [qdrant:/qdrant/storage]
    networks: [internal]

  embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-m3"]
    volumes: [hf:/data]
    networks: [internal, models_download]

  vllm:
    image: vllm/vllm-openai:v0.9.2
    profiles: [gpu]
    restart: unless-stopped
    command: ["--model", "Qwen/Qwen3-8B", "--max-model-len", "16384"]
    volumes: [hf:/root/.cache/huggingface]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    networks: [internal, models_download]

networks:
  edge: {}
  internal: {internal: true}
  models_download: {}

volumes:
  caddy_data: {}
  corpus: {}
  audit: {}
  qdrant: {}
  hf: {}
